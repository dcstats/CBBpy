name: Run pytest

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/pytest.yml'

jobs:
  # Deterministic tests against recorded ESPN pages — no network. A failure
  # here means the code changed behavior. Runs on every supported Python.
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
      fail-fast: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install package in editable mode
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Install testing tools
        run: pip install pytest pyarrow

      - name: Run offline tests
        run: pytest tests/ -m "not live"

  # Same offline suite, but with every dependency installed at the minimum
  # version pyproject.toml claims to support (uv resolves the floors directly
  # from the metadata, so there's no separate pin list to keep in sync). A
  # failure here means a declared floor is dishonest — raise it rather than
  # working around it. Python 3.9 because the floors must hold on the oldest
  # supported interpreter; pytest/pyarrow are installed separately at their
  # latest versions since lowest-direct would otherwise pick ancient ones.
  offline-min-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.9'

      - name: Install package with lowest supported dependency versions
        run: |
          uv venv
          uv pip install --resolution lowest-direct -e .
          uv pip install pytest pyarrow

      - name: Run offline tests
        run: uv run --no-project pytest tests/ -m "not live"

  # Live invariant tests against real ESPN — verifies the scraper still works
  # against today's site. Single Python version: cross-version parsing
  # differences are already covered by the offline matrix, and one job keeps
  # ESPN request volume (and flake odds) down.
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-

      - name: Install package in editable mode
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Install testing tools
        run: pip install pytest pyarrow

      - name: Run live tests
        run: pytest tests/ -m live
